name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # godio captures audio through malgo, which compiles miniaudio via cgo.
  # The Windows runners ship mingw-w64 on PATH at C:\mingw64\bin, so no
  # toolchain setup step is needed — but cgo must be switched on explicitly,
  # since it defaults to off when cross-compilation settings are present.
  CGO_ENABLED: 1

jobs:
  build:
    name: Build and test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Show toolchain
        run: |
          go version
          gcc --version

      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Check generated icons are up to date
        shell: bash
        run: |
          go run ./scripts/genicons
          if ! git diff --exit-code -- internal/assets/icons; then
            echo "Tray icons differ from scripts/genicons output."
            echo "Run 'go run ./scripts/genicons' and commit the result."
            exit 1
          fi

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "value=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "value=dev-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        shell: bash
        # -extldflags=-static links the mingw runtime in, so the result does not
        # need libgcc/libwinpthread beside it. The DLL check below proves it.
        #
        # godio-tray additionally gets -H windowsgui: a GUI-subsystem process
        # started from a terminal is not attached to that console, so it shows
        # no console window and survives the terminal closing.
        run: |
          common="-s -w -X main.version=${{ steps.version.outputs.value }} -extldflags=-static"
          go build -trimpath -ldflags "$common" -o godio.exe ./cmd/godio
          go build -trimpath -ldflags "$common -H windowsgui" -o godio-tray.exe ./cmd/godio-tray

      - name: Verify the binaries
        shell: bash
        # Checks the PE subsystem (the tray must be GUI, or it opens a console
        # window and dies with the launching terminal) and the imported DLLs
        # (nothing from the mingw runtime, or the exe is not self-contained).
        run: |
          ./godio.exe version
          go run ./scripts/checkpe godio.exe console godio-tray.exe gui

      - name: Package
        shell: pwsh
        # Two assets: the zip for a first install (it carries the README and the
        # dependency script), and the bare exe for upgrading in place, where
        # re-downloading the docs is just noise.
        run: |
          New-Item -ItemType Directory -Force dist/godio | Out-Null
          Copy-Item godio.exe, godio-tray.exe, README.md dist/godio/
          Compress-Archive -Path dist/godio/* -DestinationPath dist/godio-windows-amd64.zip
          Copy-Item godio.exe, godio-tray.exe dist/

          # Checksums, so a download can be verified against the build log.
          Get-FileHash dist/godio-windows-amd64.zip, dist/godio.exe, dist/godio-tray.exe -Algorithm SHA256 |
            ForEach-Object { "{0}  {1}" -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf) } |
            Tee-Object -FilePath dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: godio-windows-amd64
          path: |
            dist/godio-windows-amd64.zip
            dist/godio.exe
            dist/godio-tray.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

  release:
    name: Attach to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: godio-windows-amd64

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(godio-tray.exe godio.exe godio-windows-amd64.zip SHA256SUMS.txt)
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "${assets[@]}" \
          || gh release upload "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber "${assets[@]}"

  winget:
    name: Submit to winget
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      # Opens a pull request against microsoft/winget-pkgs for this tag: the
      # action takes the previous version's manifests from the index, bumps
      # the version and the installer URL, and hashes the published asset
      # itself. packaging/winget is the copy this repository keeps of what it
      # submitted; the action does not read it.
      #
      # It files *updates* only. The first version of a package has to be
      # submitted by hand (wingetcreate new), after which every tag reaches
      # winget through this job.
      #
      # WINGET_TOKEN is a classic PAT with the public_repo scope, on an account
      # that has forked microsoft/winget-pkgs — the default GITHUB_TOKEN cannot
      # push to another repository.
      - uses: vedantmgoyal/winget-releaser@v2
        with:
          identifier: ClementHerve.Godio
          installers-regex: 'godio-windows-amd64\.zip$'
          token: ${{ secrets.WINGET_TOKEN }}
