ShortDescription: Records meetings, transcribes them with Whisper and writes the notes into Obsidian through Claude Code.
Description: |-
  Godio records both sides of a meeting — your microphone and the system
  output — as two separate tracks, transcribes them locally with whisper.cpp,
  then has Claude Code turn the merged transcript into notes appended to the
  day's Obsidian note.

  It ships two commands: godio, the command line (setup, doctor, record,
  transcribe, extract, write), and godio-tray, a notification-area icon that
  runs the same pipeline without a console window.
